# Persistent, non-secret Kuib configuration.
# Production default: ~/.config/kuib/config.toml

[node]
# label = "user@machine"

[target]
# node = "user@machine"

[model]
default = "groq/llama-3.3-70b-versatile"
# default = "meta/muse-spark-1.1"     # needs KUIB_META_API_KEY
# default = "mimo/mimo-v2.5-pro"      # needs KUIB_MIMO_API_KEY
# base_url = "http://localhost:11434/v1"   # openai-compatible only

[logging]
level = "info"

[telemetry]
# endpoint = "http://localhost:6006"

[web]
port = 4321

[security]
profile = "development"
